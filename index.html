<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Eggs" />
<meta name="theme-color" content="#1b1a17" />
<title>Eggs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%9A%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231b1a17'/%3E%3Cellipse cx='90' cy='96' rx='46' ry='58' fill='%23f3e3c3'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #1b1a17; --card: #26241f; --line: #3a372f; --text: #f3ede0; --muted: #a39b88;
    --accent: #f2b33d; --good: #7cc47f; --bad: #e07a5f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 16px 8px; }
  header h1 { margin: 0; font-size: 24px; }
  header .rev { color: var(--muted); font-size: 11px; }
  main { padding: 0 16px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; }
  .card h2 { margin: 0 0 10px; font-size: 15px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  input, select { width: 100%; padding: 10px; font-size: 16px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px; background: var(--accent); color: #1b1a17;
    font-weight: 700; cursor: pointer; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  button.danger { background: var(--bad); color: #fff; }
  .counter { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 6px 0 12px; }
  .counter button { width: 56px; height: 56px; font-size: 28px; padding: 0; border-radius: 50%; }
  .counter .num { font-size: 56px; font-weight: 800; min-width: 90px; text-align: center; font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat { background: var(--bg); border-radius: 10px; padding: 10px; }
  .stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--bad); }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  ul.list li:first-child { border-top: 0; }
  ul.list .sub { color: var(--muted); font-size: 13px; }
  ul.list .del { background: none; color: var(--muted); padding: 4px 8px; font-size: 18px; }
  .empty { color: var(--muted); text-align: center; padding: 8px 0; }
  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
  .seg button { flex: 1; background: transparent; color: var(--muted); padding: 8px; font-weight: 600; }
  .seg button.on { background: var(--line); color: var(--text); }
  svg.chart { width: 100%; height: 140px; display: block; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; background: none; color: var(--muted); border-radius: 0; padding: 10px 0 12px; font-size: 12px; font-weight: 600; }
  nav button span { display: block; font-size: 20px; }
  nav button.on { color: var(--accent); }
  .view { display: none; } .view.on { display: block; }
  #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-weight: 600; opacity: 0;
    transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🥚 Eggs</h1>
  <span class="rev" id="rev"></span>
</header>

<main>
  <!-- TODAY -->
  <section class="view on" id="v-today">
    <div class="card">
      <h2>Collect</h2>
      <label for="c-date">Date</label>
      <input type="date" id="c-date" />
      <div class="counter">
        <button class="ghost" id="c-minus" aria-label="Minus one">−</button>
        <div class="num" id="c-num">0</div>
        <button id="c-plus" aria-label="Plus one">+</button>
      </div>
      <button id="c-save" style="width:100%">Save collection</button>
      <div class="sub" id="c-hint" style="color:var(--muted);font-size:13px;text-align:center;margin-top:8px"></div>
    </div>
    <div class="card">
      <h2>At a glance</h2>
      <div class="stats" id="glance"></div>
    </div>
    <div class="card">
      <h2>Last 30 days</h2>
      <svg class="chart" id="chart" viewBox="0 0 300 140" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <!-- MONEY -->
  <section class="view" id="v-money">
    <div class="card">
      <div class="seg" id="m-seg">
        <button data-k="sale" class="on">Sale</button>
        <button data-k="expense">Expense</button>
      </div>
      <form id="sale-form">
        <div class="row">
          <div><label>Date</label><input type="date" id="s-date" required /></div>
          <div><label>Dozens</label><input type="number" id="s-doz" min="0" step="0.5" inputmode="decimal" required /></div>
        </div>
        <div class="row">
          <div><label>$ per dozen</label><input type="number" id="s-price" min="0" step="0.25" inputmode="decimal" required /></div>
          <div><label>Customer (optional)</label><input type="text" id="s-cust" list="cust-list" /></div>
        </div>
        <datalist id="cust-list"></datalist>
        <button style="width:100%;margin-top:12px">Add sale</button>
      </form>
      <form id="exp-form" style="display:none">
        <div class="row">
          <div><label>Date</label><input type="date" id="e-date" required /></div>
          <div><label>Amount $</label><input type="number" id="e-amt" min="0" step="0.01" inputmode="decimal" required /></div>
        </div>
        <label>Item</label>
        <select id="e-cat">
          <option>Feed</option><option>Bedding</option><option>Supplements</option>
          <option>Cartons</option><option>Birds</option><option>Equipment</option><option>Other</option>
        </select>
        <label>Note (optional)</label><input type="text" id="e-note" />
        <button style="width:100%;margin-top:12px">Add expense</button>
      </form>
    </div>
    <div class="card">
      <h2>Recent</h2>
      <ul class="list" id="money-list"></ul>
    </div>
  </section>

  <!-- HISTORY -->
  <section class="view" id="v-history">
    <div class="card">
      <h2>Collections</h2>
      <ul class="list" id="hist-list"></ul>
    </div>
  </section>

  <!-- STATS -->
  <section class="view" id="v-stats">
    <div class="card">
      <div class="seg" id="p-seg">
        <button data-p="7">7 days</button>
        <button data-p="30" class="on">30 days</button>
        <button data-p="365">Year</button>
        <button data-p="0">All</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="v-settings">
    <div class="card">
      <h2>Flock</h2>
      <div class="row">
        <div><label>Laying hens</label><input type="number" id="set-hens" min="0" inputmode="numeric" /></div>
        <div><label>Default $/dozen</label><input type="number" id="set-price" min="0" step="0.25" inputmode="decimal" /></div>
      </div>
      <button style="width:100%;margin-top:12px" id="set-save">Save</button>
    </div>
    <div class="card">
      <h2>Data</h2>
      <div class="row">
        <button class="ghost" id="exp-json">Export backup</button>
        <button class="ghost" id="imp-json">Import backup</button>
      </div>
      <button class="ghost" id="exp-csv" style="width:100%;margin-top:8px">Export CSV</button>
      <input type="file" id="imp-file" accept="application/json" hidden />
      <button class="danger" id="wipe" style="width:100%;margin-top:8px">Erase all data</button>
      <p style="color:var(--muted);font-size:13px">Data is stored on this device only. Export a backup now and then.</p>
    </div>
  </section>
</main>

<nav id="nav">
  <button data-v="today" class="on"><span>🥚</span>Today</button>
  <button data-v="money"><span>💵</span>Money</button>
  <button data-v="history"><span>📋</span>History</button>
  <button data-v="stats"><span>📊</span>Stats</button>
  <button data-v="settings"><span>⚙️</span>Settings</button>
</nav>
<div id="toast"></div>

<script>
const REV = 1;
const KEY = 'eggs-data';
const SCHEMA_VERSION = 1;
document.getElementById('rev').textContent = 'rev ' + REV;

// ── Storage ─────────────────────────────────────────────────────────────────
function blank() {
  return { v: SCHEMA_VERSION, settings: { hens: 0, price: 5 }, collections: [], sales: [], expenses: [] };
}
function migrate(d) {
  if (!d || typeof d !== 'object') return blank();
  const b = blank();
  d.settings = Object.assign(b.settings, d.settings || {});
  d.collections = d.collections || []; d.sales = d.sales || []; d.expenses = d.expenses || [];
  d.v = SCHEMA_VERSION;
  return d;
}
function load() {
  try { return migrate(JSON.parse(localStorage.getItem(KEY))); } catch { return blank(); }
}
let db = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch { toast('Could not save — storage unavailable'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// ── Helpers ────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoDay(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return isoDay(d); };
const money = n => (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(2);
const fmtDate = s => new Date(s + 'T12:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

// Eggs per date (multiple saves on the same date are summed)
function eggsByDate() {
  const m = {};
  for (const c of db.collections) m[c.date] = (m[c.date] || 0) + c.count;
  return m;
}

function summarize(days) {
  const from = days ? daysAgo(days - 1) : '0000-00-00';
  const inRange = x => x.date >= from;
  const cols = db.collections.filter(inRange);
  const sales = db.sales.filter(inRange);
  const exps = db.expenses.filter(inRange);
  const eggs = cols.reduce((a, c) => a + c.count, 0);
  const loggedDays = new Set(cols.map(c => c.date)).size;
  let spanDays = days;
  if (!days) {
    const all = db.collections.map(c => c.date).sort();
    spanDays = all.length ? Math.round((new Date(today()) - new Date(all[0])) / 864e5) + 1 : 0;
  }
  const dozSold = sales.reduce((a, s) => a + s.dozens, 0);
  const income = sales.reduce((a, s) => a + s.dozens * s.price, 0);
  const spent = exps.reduce((a, e) => a + e.amount, 0);
  const perDay = loggedDays ? eggs / loggedDays : 0;
  const hens = db.settings.hens;
  return {
    eggs, dozens: eggs / 12, perDay, loggedDays, spanDays,
    layRate: hens && loggedDays ? perDay / hens * 100 : null,
    dozSold, income, spent, net: income - spent,
    costPerDoz: eggs ? spent / (eggs / 12) : null,
  };
}

function onHand() {
  const laid = db.collections.reduce((a, c) => a + c.count, 0);
  const sold = db.sales.reduce((a, s) => a + s.dozens * 12, 0);
  return laid - sold;
}

// ── Today ──────────────────────────────────────────────────────────────────
let count = 0;
function syncCounterFromDate() {
  count = eggsByDate()[$('c-date').value] || 0;
  $('c-num').textContent = count;
  $('c-hint').textContent = count ? 'Already logged for this date — saving replaces the total.' : '';
}
$('c-date').value = today();
$('c-date').addEventListener('change', syncCounterFromDate);
$('c-plus').onclick = () => { $('c-num').textContent = ++count; };
$('c-minus').onclick = () => { count = Math.max(0, count - 1); $('c-num').textContent = count; };
$('c-save').onclick = () => {
  const date = $('c-date').value || today();
  db.collections = db.collections.filter(c => c.date !== date);
  if (count > 0) db.collections.push({ id: uid(), date, count });
  save(); render(); toast(`Saved ${count} egg${count === 1 ? '' : 's'} ✓`);
};

function renderGlance() {
  const w = summarize(7), m = summarize(30);
  const byDate = eggsByDate();
  const items = [
    [byDate[today()] || 0, 'Today'],
    [w.eggs, 'Last 7 days'],
    [w.perDay.toFixed(1), 'Avg / day (7d)'],
    [w.layRate == null ? '—' : w.layRate.toFixed(0) + '%', 'Lay rate (7d)'],
    [Math.max(0, onHand()), 'Eggs on hand'],
    [`<span class="${m.net >= 0 ? 'good' : 'bad'}">${money(m.net)}</span>`, 'Net (30d)'],
  ];
  $('glance').innerHTML = items.map(([v, l]) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
}

function renderChart() {
  const byDate = eggsByDate();
  const vals = []; for (let i = 29; i >= 0; i--) vals.push(byDate[daysAgo(i)] || 0);
  const max = Math.max(1, ...vals);
  const W = 300, H = 140, gap = 2, bw = W / vals.length - gap;
  let s = '';
  vals.forEach((v, i) => {
    const h = v / max * (H - 18);
    s += `<rect x="${i * (bw + gap)}" y="${H - h}" width="${bw}" height="${h}" rx="2" fill="${i === 29 ? 'var(--accent)' : '#8a7a55'}"><title>${fmtDate(daysAgo(29 - i))}: ${v}</title></rect>`;
  });
  s += `<text x="0" y="11" fill="var(--muted)" font-size="11">max ${max}</text>`;
  $('chart').innerHTML = s;
}

// ── Money ──────────────────────────────────────────────────────────────────
let mode = 'sale';
$('m-seg').onclick = e => {
  const k = e.target.dataset.k; if (!k) return;
  mode = k;
  [...$('m-seg').children].forEach(b => b.classList.toggle('on', b.dataset.k === k));
  $('sale-form').style.display = k === 'sale' ? '' : 'none';
  $('exp-form').style.display = k === 'expense' ? '' : 'none';
};
function resetMoneyForms() {
  $('s-date').value = today(); $('e-date').value = today();
  $('s-price').value = db.settings.price; $('s-doz').value = ''; $('s-cust').value = '';
  $('e-amt').value = ''; $('e-note').value = '';
}
$('sale-form').onsubmit = e => {
  e.preventDefault();
  const dozens = parseFloat($('s-doz').value), price = parseFloat($('s-price').value);
  if (!(dozens > 0) || !(price >= 0)) return toast('Check dozens and price');
  db.sales.push({ id: uid(), date: $('s-date').value || today(), dozens, price, customer: $('s-cust').value.trim() });
  save(); resetMoneyForms(); render(); toast('Sale added ✓');
};
$('exp-form').onsubmit = e => {
  e.preventDefault();
  const amount = parseFloat($('e-amt').value);
  if (!(amount > 0)) return toast('Enter an amount');
  db.expenses.push({ id: uid(), date: $('e-date').value || today(), amount, category: $('e-cat').value, note: $('e-note').value.trim() });
  save(); resetMoneyForms(); render(); toast('Expense added ✓');
};

function renderMoney() {
  const rows = [
    ...db.sales.map(s => ({ ...s, kind: 'sale', amt: s.dozens * s.price })),
    ...db.expenses.map(x => ({ ...x, kind: 'expense', amt: -x.amount })),
  ].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, 50);
  $('money-list').innerHTML = rows.length ? rows.map(r => `
    <li>
      <div>
        <div>${r.kind === 'sale' ? `${r.dozens} doz @ ${money(r.price)}${r.customer ? ' · ' + esc(r.customer) : ''}` : esc(r.category) + (r.note ? ' · ' + esc(r.note) : '')}</div>
        <div class="sub">${fmtDate(r.date)}</div>
      </div>
      <div class="row" style="flex:0 0 auto">
        <strong class="${r.amt >= 0 ? 'good' : 'bad'}">${money(r.amt)}</strong>
        <button class="del" data-kind="${r.kind}" data-id="${r.id}" aria-label="Delete">×</button>
      </div>
    </li>`).join('') : '<li class="empty">No sales or expenses yet</li>';
  const custs = [...new Set(db.sales.map(s => s.customer).filter(Boolean))];
  $('cust-list').innerHTML = custs.map(c => `<option value="${esc(c)}">`).join('');
}
$('money-list').onclick = e => {
  const b = e.target.closest('.del'); if (!b) return;
  if (!confirmDelete()) return;
  const list = b.dataset.kind === 'sale' ? 'sales' : 'expenses';
  db[list] = db[list].filter(x => x.id !== b.dataset.id);
  save(); render(); toast('Deleted');
};

// ── History ────────────────────────────────────────────────────────────────
function renderHistory() {
  const rows = [...db.collections].sort((a, b) => b.date.localeCompare(a.date));
  $('hist-list').innerHTML = rows.length ? rows.map(c => `
    <li>
      <div><div>${fmtDate(c.date)}</div><div class="sub">${c.date}</div></div>
      <div class="row" style="flex:0 0 auto">
        <strong>${c.count}</strong>
        <button class="del" data-id="${c.id}" aria-label="Delete">×</button>
      </div>
    </li>`).join('') : '<li class="empty">No collections logged yet</li>';
}
$('hist-list').onclick = e => {
  const b = e.target.closest('.del'); if (!b) return;
  if (!confirmDelete()) return;
  db.collections = db.collections.filter(c => c.id !== b.dataset.id);
  save(); render(); toast('Deleted');
};

// Two-tap delete instead of a blocking confirm() dialog
let armed = 0;
function confirmDelete() {
  if (Date.now() - armed < 2500) { armed = 0; return true; }
  armed = Date.now(); toast('Tap × again to delete'); return false;
}

// ── Stats ──────────────────────────────────────────────────────────────────
let period = 30;
$('p-seg').onclick = e => {
  if (e.target.dataset.p == null) return;
  period = +e.target.dataset.p;
  [...$('p-seg').children].forEach(b => b.classList.toggle('on', +b.dataset.p === period));
  renderStats();
};
function renderStats() {
  const s = summarize(period);
  const items = [
    [s.eggs, 'Eggs collected'],
    [s.dozens.toFixed(1), 'Dozens'],
    [s.perDay.toFixed(1), 'Avg / logged day'],
    [s.layRate == null ? '—' : s.layRate.toFixed(0) + '%', 'Lay rate'],
    [`${s.loggedDays}/${s.spanDays}`, 'Days logged'],
    [s.dozSold, 'Dozens sold'],
    [`<span class="good">${money(s.income)}</span>`, 'Income'],
    [`<span class="bad">${money(s.spent)}</span>`, 'Expenses'],
    [`<span class="${s.net >= 0 ? 'good' : 'bad'}">${money(s.net)}</span>`, 'Net'],
    [s.costPerDoz == null ? '—' : money(s.costPerDoz), 'Cost / dozen'],
  ];
  $('stats').innerHTML = items.map(([v, l]) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
}

// ── Settings ───────────────────────────────────────────────────────────────
function renderSettings() { $('set-hens').value = db.settings.hens; $('set-price').value = db.settings.price; }
$('set-save').onclick = () => {
  db.settings.hens = Math.max(0, parseInt($('set-hens').value) || 0);
  db.settings.price = Math.max(0, parseFloat($('set-price').value) || 0);
  save(); render(); toast('Settings saved ✓');
};
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('exp-json').onclick = () => download(`eggs-backup-${today()}.json`, JSON.stringify(db, null, 2), 'application/json');
$('exp-csv').onclick = () => {
  const lines = ['type,date,eggs,dozens,price,amount,category,customer,note'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  db.collections.forEach(c => lines.push(['collection', c.date, c.count, '', '', '', '', '', ''].map(q).join(',')));
  db.sales.forEach(s => lines.push(['sale', s.date, '', s.dozens, s.price, (s.dozens * s.price).toFixed(2), '', s.customer, ''].map(q).join(',')));
  db.expenses.forEach(x => lines.push(['expense', x.date, '', '', '', x.amount.toFixed(2), x.category, '', x.note].map(q).join(',')));
  download(`eggs-${today()}.csv`, lines.join('\n'), 'text/csv');
};
$('imp-json').onclick = () => $('imp-file').click();
$('imp-file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.collections)) throw 0;
    db = migrate(d); save(); render(); toast('Backup imported ✓');
  } catch { toast('That file is not an Eggs backup'); }
  e.target.value = '';
};
let wipeArmed = 0;
$('wipe').onclick = () => {
  if (Date.now() - wipeArmed > 3000) { wipeArmed = Date.now(); return toast('Tap again to erase everything'); }
  db = blank(); save(); render(); toast('All data erased');
};

// ── Nav ────────────────────────────────────────────────────────────────────
$('nav').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('nav').children].forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + b.dataset.v));
  window.scrollTo(0, 0);
};

function render() {
  syncCounterFromDate(); renderGlance(); renderChart(); renderMoney(); renderHistory(); renderStats(); renderSettings();
}
resetMoneyForms();
render();
</script>
</body>
</html>
